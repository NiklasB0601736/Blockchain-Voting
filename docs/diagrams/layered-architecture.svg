<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Aktueller Schichtenstand des Voting-on-Blockchain-Prototyps</title>
  <desc id="desc">Schichtenmodell des Projekts: getrennte Demo-Clients, eigene verteilbare Python-Chain, Petlib-Kryptografie und offene produktionskritische Sicherheitsbausteine.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .band { fill: #ffffff; stroke: #1f2937; stroke-width: 1.4; }
      .done { fill: #e8f7ef; stroke: #147a43; stroke-width: 1.5; }
      .open { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .head { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .txt { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .tag { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="760"/>
  <text class="title" x="48" y="52">Voting-on-Blockchain: aktueller Demo-Stand</text>
  <text class="txt" x="48" y="80">Der Prototyp zeigt eine eigene lokale Python-Chain mit verschluesselten Stimmen und oeffentlich pruefbarer Threshold-Auszaehlung.</text>

  <rect class="band done" x="60" y="115" width="1060" height="125" rx="8"/>
  <text class="head" x="90" y="153">Level 4 - Bedienung und Rollen</text>
  <text class="txt" x="90" y="181">Node Dashboard, Voter Client, Committee Client, Node Launcher, Demo-Netzwerk-Skript</text>
  <rect class="done" x="720" y="142" width="350" height="70" rx="6"/>
  <text class="tag" x="742" y="166">IMPLEMENTIERT</text>
  <text class="small" x="742" y="187">Wahl erstellen, verschluesselt waehlen,</text>
  <text class="small" x="742" y="205">Committee-Tally publishen, Verify ansehen</text>

  <rect class="band done" x="60" y="270" width="1060" height="130" rx="8"/>
  <text class="head" x="90" y="309">Level 3 - Noble/Petlib-Wahlkryptografie</text>
  <text class="txt" x="90" y="337">lokale Browser-Verschluesselung, One-Hot-Ballots, homomorphe Aggregation,</text>
  <text class="txt" x="90" y="352">Threshold Decryption, Chaum-Pedersen-Proofs</text>
  <rect class="done" x="720" y="300" width="350" height="72" rx="6"/>
  <text class="tag" x="742" y="324">IMPLEMENTIERT ALS PROTOTYP</text>
  <text class="small" x="742" y="345">Private Shares als einzelne lokale Dateien</text>
  <text class="small" x="742" y="363">Nodes verifizieren Result ohne Private Shares</text>

  <rect class="band done" x="60" y="430" width="1060" height="130" rx="8"/>
  <text class="head" x="90" y="469">Level 2 - Demo-Eligibility und Double Voting</text>
  <text class="txt" x="90" y="497">Registrierung per Demo-Commitment, daran gebundener nullifier_hash</text>
  <text class="txt" x="90" y="512">Placeholder-Felder fuer Eligibility und Ballot Validity</text>
  <rect class="done" x="720" y="460" width="350" height="72" rx="6"/>
  <text class="tag" x="742" y="484">DEMO-FUNKTION IMPLEMENTIERT</text>
  <text class="small" x="742" y="505">Double Voting wird abgelehnt</text>
  <text class="small" x="742" y="523">anonyme Semaphore-/ZK-Bindung offen</text>

  <rect class="band done" x="60" y="590" width="510" height="105" rx="8"/>
  <text class="head" x="90" y="628">Level 1 - Eigene Python-Chain</text>
  <text class="txt" x="90" y="656">PoA, Ed25519, Mempool, Blocks, JSON-Persistenz, Peers, Sync</text>
  <text class="small" x="90" y="678">Lokale Node 1/2/3 Demo mit gleichem Latest-Hash nach Sync</text>
  <rect class="band open" x="610" y="590" width="510" height="105" rx="8"/>
  <text class="head" x="640" y="628">Produktionsluecken</text>
  <text class="txt" x="640" y="656">Semaphore, Ballot-ZK-Proofs, Metadaten-Schutz, Audits, Rechtsrahmen</text>
  <text class="small" x="640" y="678">Nicht noetig fuer die Demo, aber noetig fuer echte Nutzung</text>

  <path class="arrow" d="M590 250 L590 270"/>
  <path class="arrow" d="M590 410 L590 430"/>
  <path class="arrow" d="M590 570 L590 590"/>

  <rect x="60" y="720" width="18" height="18" rx="3" class="done"/>
  <text class="small" x="86" y="734">im Demo-Prototyp vorhanden</text>
  <rect x="285" y="720" width="18" height="18" rx="3" class="open"/>
  <text class="small" x="311" y="734">Ausblick fuer echte Standards</text>
</svg>
