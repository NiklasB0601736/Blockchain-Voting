<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="820" viewBox="0 0 1260 820" role="img" aria-labelledby="title desc">
  <title id="title">V2 Demo Flow fuer verschluesselte Stimmen und Threshold-Auszaehlung</title>
  <desc id="desc">Ablauf vom Voter Client ueber Mempool und Block bis zur Committee-Auszaehlung und oeffentlichen Verifikation.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 1.4; }
      .client { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .chain { fill: #e8f7ef; stroke: #147a43; stroke-width: 1.5; }
      .committee { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
      .open { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .head { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .txt { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #374151; }
      .small { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .arrow { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1260" height="820"/>
  <text class="title" x="48" y="52">V2 Demo-Ablauf: verschluesselte Stimme bis oeffentliches Verify</text>
  <text class="txt" x="48" y="80">Secret und Klarwahl bleiben im Browser. Auf der Chain landen encrypted_ballot, nullifier_hash und spaeter Tally-Proofs.</text>

  <rect class="client" x="55" y="125" width="245" height="130" rx="8"/>
  <text class="head" x="80" y="158">1. Voter Client</text>
  <text class="txt" x="80" y="184">Kandidat mit Index waehlen</text>
  <text class="mono" x="80" y="210">one_hot = [0,1,0]</text>
  <text class="small" x="80" y="232">nur lokale Vorschau</text>

  <rect class="client" x="355" y="125" width="285" height="130" rx="8"/>
  <text class="head" x="380" y="158">2. Browser verschluesselt</text>
  <text class="txt" x="380" y="184">EC-ElGamal pro Kandidat</text>
  <text class="mono" x="380" y="210">[Enc(0), Enc(1), Enc(0)]</text>
  <text class="small" x="380" y="232">Noble P-256, Petlib-kompatibel</text>

  <rect class="chain" x="705" y="125" width="245" height="130" rx="8"/>
  <text class="head" x="730" y="158">3. Mempool</text>
  <text class="txt" x="730" y="184">Node prueft Regeln</text>
  <text class="txt" x="730" y="207">Nullifier noch frei?</text>
  <text class="small" x="730" y="232">Vote ist noch nicht committed</text>

  <rect class="chain" x="1005" y="125" width="205" height="130" rx="8"/>
  <text class="head" x="1030" y="158">4. Block</text>
  <text class="txt" x="1030" y="184">Validator mined</text>
  <text class="txt" x="1030" y="207">Ed25519-Signatur</text>
  <text class="small" x="1030" y="232">Vote ist committed</text>

  <rect class="chain" x="725" y="325" width="300" height="130" rx="8"/>
  <text class="head" x="750" y="358">5. Multi-Node Sync</text>
  <text class="txt" x="750" y="384">Node 2/3 uebernehmen gueltige Chain</text>
  <text class="txt" x="750" y="407">gleiche Chain-Length</text>
  <text class="mono" x="750" y="430">same latest_block_hash</text>

  <rect class="committee" x="105" y="520" width="315" height="150" rx="8"/>
  <text class="head" x="130" y="553">6. Committee Preview</text>
  <text class="txt" x="130" y="579">Threshold pruefen, z.B. 3 von 5</text>
  <text class="txt" x="130" y="602">2 Shares: keine Entschluesselung</text>
  <text class="txt" x="130" y="625">3 Shares: Tally kann published werden</text>
  <text class="small" x="130" y="648">einzelne private Share-Dateien</text>

  <rect class="committee" x="490" y="520" width="315" height="150" rx="8"/>
  <text class="head" x="515" y="553">7. Publish Tally Result</text>
  <text class="txt" x="515" y="579">encrypted tally aus Ballots</text>
  <text class="txt" x="515" y="602">Partial Decryptions + Proofs</text>
  <text class="mono" x="515" y="628">plaintext_tally = [1,2,0]</text>
  <text class="small" x="515" y="650">als Chain-Transaktion gespeichert</text>

  <rect class="box" x="875" y="515" width="315" height="160" rx="8"/>
  <text class="head" x="900" y="548">8. Public Verify</text>
  <text class="txt" x="900" y="574">Nullifier eindeutig</text>
  <text class="txt" x="900" y="596">encrypted Ballots aggregierbar</text>
  <text class="txt" x="900" y="618">published encrypted tally passt</text>
  <text class="txt" x="900" y="640">Partial Proofs gueltig</text>
  <text class="txt" x="900" y="662">Plaintext Result passt</text>

  <rect class="open" x="55" y="710" width="1135" height="70" rx="8"/>
  <text class="head" x="82" y="740">Ausblick fuer echte Nutzung</text>
  <text class="txt" x="82" y="764">Semaphore/Membership-Proofs, echte Ballot-ZK-Proofs, sichere Share-Verteilung, Metadaten-Schutz, Audits, rechtliche Zulassung.</text>

  <path class="arrow" d="M300 190 L355 190"/>
  <path class="arrow" d="M640 190 L705 190"/>
  <path class="arrow" d="M950 190 L1005 190"/>
  <path class="arrow" d="M1107 255 L925 325"/>
  <path class="arrow" d="M725 420 L420 520"/>
  <path class="arrow" d="M420 595 L490 595"/>
  <path class="arrow" d="M805 595 L875 595"/>
  <path class="arrow dash" d="M210 670 L210 710"/>
  <path class="arrow dash" d="M645 670 L645 710"/>
  <path class="arrow dash" d="M1030 675 L1030 710"/>
</svg>
